name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Lint
        run: pnpm lint

      # Engine unit, property and golden tests; repository and sync-outbox
      # tests; catalog import tests. Coverage thresholds live in each package's
      # vitest config — packages/core must stay at 100% branches (Phase 0 gate).
      - name: Test
        run: pnpm -r run test

      - name: Engine coverage
        run: pnpm --filter @nt/core run test:coverage

      # The bundled catalog must rebuild from the committed fixtures with no
      # API key, and stay inside the 15 MB budget in spec 2.3.
      - name: Rebuild bundled catalog
        run: pnpm catalog:build

      - name: Catalog is reproducible
        run: git diff --exit-code --stat -- apps/mobile/assets || (echo "Rebuilt catalog differs from the committed one" && exit 1)

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Catches anything Metro cannot resolve, which typecheck alone misses.
      - name: Bundle the app
        run: pnpm --filter @nt/mobile exec expo export --platform ios --output-dir /tmp/export

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The FDC key is deactivated by USDA if it appears in a public repo.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
